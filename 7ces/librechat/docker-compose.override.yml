# 7CE's — copy this file into the ROOT of your LibreChat clone (next to its docker-compose.yml),
# together with librechat.yaml from this folder. It mounts our config into the LibreChat container.
# LibreChat reads librechat.yaml at /app/librechat.yaml. After copying, run:
#   docker compose up -d
services:
  api:
    volumes:
      - ./librechat.yaml:/app/librechat.yaml
