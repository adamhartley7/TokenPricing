<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>7CE's — direct chat</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font: 15px/1.55 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0d1117; color: #e6edf3;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid #21262d; background: #161b22;
  }
  header h1 { font-size: 16px; margin: 0; }
  header h1 small { color: #8b949e; font-weight: 400; }
  header .sp { flex: 1; }
  header a { color: #58a6ff; text-decoration: none; font-size: 13px; }
  select, input, textarea, button {
    font: inherit; color: #e6edf3; background: #0d1117;
    border: 1px solid #30363d; border-radius: 8px; padding: 6px 9px;
  }
  label { font-size: 12px; color: #8b949e; display: inline-flex; gap: 6px; align-items: center; }
  .controls { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 16px; border-bottom: 1px solid #21262d; align-items: center; }
  .controls input[type=number] { width: 84px; }
  #sysWrap { width: 100%; display: none; }
  #sysWrap textarea { width: 100%; min-height: 56px; margin-top: 6px; resize: vertical; }
  main { flex: 1; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 760px; }
  .msg .who { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #8b949e; margin-bottom: 3px; }
  .msg .body { white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; text-align: right; }
  .msg.user .body { background: #1f6feb; color: #fff; padding: 8px 12px; border-radius: 12px 12px 2px 12px; display: inline-block; text-align: left; }
  .msg.assistant .body { background: #161b22; border: 1px solid #21262d; padding: 8px 12px; border-radius: 12px 12px 12px 2px; }
  .msg.error .body { background: #2d1213; border: 1px solid #5c1a1d; color: #ff9a9a; padding: 8px 12px; border-radius: 10px; }
  .think { color: #6e7681; font-style: italic; }
  footer { display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid #21262d; background: #161b22; align-items: flex-end; }
  footer textarea { flex: 1; min-height: 44px; max-height: 180px; resize: vertical; }
  footer button { background: #238636; border-color: #2ea043; padding: 9px 18px; cursor: pointer; }
  footer button:disabled { opacity: .5; cursor: default; }
  .meter { font-size: 12px; color: #8b949e; padding: 4px 16px 0; }
  .meter b { color: #e6edf3; }
</style>
</head>
<body>
  <header>
    <h1>7CE's <small>direct chat · no Docker</small></h1>
    <div class="sp"></div>
    <a href="/">cost meter →</a>
  </header>

  <div class="controls">
    <label>Model
      <select id="model">
        <option value="deepseek-v4-flash">deepseek-v4-flash (cheap)</option>
        <option value="deepseek-v4-pro">deepseek-v4-pro (smarter)</option>
      </select>
    </label>
    <label>Max reply tokens <input id="maxtok" type="number" value="1024" min="16" max="8192" /></label>
    <label>Cap this msg ($) <input id="cap" type="number" step="0.01" placeholder="default" style="width:90px" /></label>
    <label><input id="sysToggle" type="checkbox" /> system prompt</label>
    <button id="clear" style="margin-left:auto;background:#21262d;border-color:#30363d;cursor:pointer">New chat</button>
    <div id="sysWrap"><textarea id="sys" placeholder="Optional: shape the answer — e.g. 'Reply only in concise Markdown.'"></textarea></div>
  </div>

  <main id="log"></main>
  <div class="meter" id="meter">session spend: <b>$0.00</b></div>

  <footer>
    <textarea id="input" placeholder="Type a message…  (Enter to send, Shift+Enter for a new line)"></textarea>
    <button id="send">Send</button>
  </footer>

<script>
const $ = (s) => document.querySelector(s);
const log = $("#log");
let messages = [];          // conversation history (no system msg here)
let busy = false;

function addMsg(role, text) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.innerHTML = `<div class="who">${role}</div><div class="body"></div>`;
  el.querySelector(".body").textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el.querySelector(".body");
}

async function refreshMeter() {
  try {
    const m = await (await fetch("/meter", { cache: "no-store" })).json();
    $("#meter").innerHTML = `session spend: <b>$${(m.totals.session_usd || 0).toFixed(5)}</b>` +
      ` · today $${(m.totals.today_usd || 0).toFixed(5)} · cap $${m.caps.per_session_usd}/session`;
  } catch {}
}

function buildPayload() {
  const sys = $("#sysToggle").checked ? $("#sys").value.trim() : "";
  const msgs = sys ? [{ role: "system", content: sys }, ...messages] : messages.slice();
  const body = {
    model: $("#model").value,
    messages: msgs,
    max_tokens: parseInt($("#maxtok").value) || 1024,
    stream: true,
  };
  return body;
}

async function send() {
  if (busy) return;
  const text = $("#input").value.trim();
  if (!text) return;
  $("#input").value = "";
  messages.push({ role: "user", content: text });
  addMsg("user", text);

  busy = true; $("#send").disabled = true;
  const bodyEl = addMsg("assistant", "");
  bodyEl.innerHTML = '<span class="think">thinking…</span>';

  const headers = { "content-type": "application/json" };
  const cap = $("#cap").value.trim();
  if (cap) headers["x-7ces-cap"] = cap;

  try {
    const res = await fetch("/deepseek/v1/chat/completions", {
      method: "POST", headers, body: JSON.stringify(buildPayload()),
    });

    if (res.status === 402) {
      const e = await res.json();
      bodyEl.parentElement.className = "msg error";
      bodyEl.textContent = "⛔ " + (e.error?.message || "blocked by the spend cap");
      messages.pop();   // don't keep the unanswered turn
      return;
    }
    if (!res.ok) {
      const t = await res.text();
      bodyEl.parentElement.className = "msg error";
      bodyEl.textContent = "Error " + res.status + ": " + t.slice(0, 300);
      messages.pop();
      return;
    }

    // stream the reply
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "", out = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n"); buf = lines.pop();
      for (const line of lines) {
        const l = line.trim();
        if (!l.startsWith("data:")) continue;
        const d = l.slice(5).trim();
        if (!d || d === "[DONE]") continue;
        try {
          const j = JSON.parse(d);
          const delta = j.choices?.[0]?.delta || {};
          if (delta.content) { out += delta.content; bodyEl.textContent = out; log.scrollTop = log.scrollHeight; }
        } catch {}
      }
    }
    if (!out) bodyEl.innerHTML = '<span class="think">(model returned no text — try more max tokens)</span>';
    messages.push({ role: "assistant", content: out });
  } catch (err) {
    bodyEl.parentElement.className = "msg error";
    bodyEl.textContent = "Could not reach the gateway: " + err.message;
    messages.pop();
  } finally {
    busy = false; $("#send").disabled = false;
    refreshMeter();
    $("#input").focus();
  }
}

$("#send").addEventListener("click", send);
$("#input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("#sysToggle").addEventListener("change", (e) => { $("#sysWrap").style.display = e.target.checked ? "block" : "none"; });
$("#clear").addEventListener("click", () => { messages = []; log.innerHTML = ""; $("#input").focus(); });

refreshMeter();
$("#input").focus();
</script>
</body>
</html>
